<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Peachtree · ROAR Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="holiday-themes.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#000;--iron-ore:#222422;--ivory:#F5F4EF;--white:#fff;--gold:#A27C3D;--danger:#B42318;--green:#16803C;--ease:cubic-bezier(.22,1,.36,1)}
[data-theme="light"]{--bg:var(--ivory);--bg-2:#E9E7DF;--card:#fff;--card-2:#F8F7F2;--text:var(--iron-ore);--muted:rgba(34,36,34,.58);--soft:rgba(34,36,34,.34);--border:rgba(34,36,34,.10);--border-2:rgba(34,36,34,.18);--nav:rgba(245,244,239,.9);--reverse:var(--ivory);--reverse-bg:var(--iron-ore);--shadow:0 16px 50px rgba(0,0,0,.09),0 2px 8px rgba(0,0,0,.05)}
[data-theme="dark"]{--bg:#141614;--bg-2:#0E100E;--card:#1C1E1C;--card-2:#151815;--text:var(--ivory);--muted:rgba(245,244,239,.58);--soft:rgba(245,244,239,.34);--border:rgba(245,244,239,.09);--border-2:rgba(245,244,239,.17);--nav:rgba(14,16,14,.9);--reverse:var(--iron-ore);--reverse-bg:var(--ivory);--shadow:0 16px 50px rgba(0,0,0,.42),0 2px 8px rgba(0,0,0,.22)}
body{font-family:Geist,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100svh}button,input,textarea,select{font-family:inherit}.hidden{display:none!important}
nav{position:sticky;top:0;z-index:10;height:68px;background:var(--nav);border-bottom:1px solid var(--border);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.nav-inner{max-width:1480px;height:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 36px}.brand{font-family:'Cormorant Garamond',serif;font-size:28px}.nav-actions{display:flex;gap:10px;align-items:center}
main{max-width:1480px;margin:0 auto;padding:34px 36px 80px}.gate{max-width:500px;margin:120px auto;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:26px;padding:28px}.gate h1{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:400;margin-bottom:10px}.gate p{color:var(--muted);line-height:1.55;margin-bottom:18px}
.btn{appearance:none;border:0;border-radius:999px;padding:10px 15px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.2s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn-primary{background:var(--reverse-bg);color:var(--reverse)}.btn-soft{border:1px solid var(--border-2);background:transparent;color:var(--muted)}.btn-danger{background:var(--danger);color:white}.btn:hover{transform:translateY(-1px)}
input,textarea,select{width:100%;border:1px solid var(--border-2);background:var(--card-2);color:var(--text);border-radius:14px;padding:12px;font-size:13px;outline:none}textarea{min-height:104px;resize:vertical}.field{display:grid;gap:7px}.field label{font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.tab{border:1px solid var(--border-2);background:var(--card);color:var(--muted);border-radius:999px;padding:9px 13px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.tab.active{background:var(--reverse-bg);color:var(--reverse);border-color:var(--reverse-bg)}
.workspace{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}.panel{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:14px}.panel-title{font-family:'Cormorant Garamond',serif;font-size:28px}.panel-sub{font-size:12px;color:var(--muted);margin-top:3px}.list{max-height:calc(100svh - 250px);overflow:auto;padding:10px}.row{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;cursor:pointer;border:1px solid transparent}.row:hover,.row.active{background:var(--bg-2);border-color:var(--border)}.row-ico{font-size:20px;width:28px}.row-main{min-width:0}.row-title{font-weight:700;font-size:13px}.row-sub{font-size:11px;color:var(--muted);line-height:1.4;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}.editor{padding:20px;display:grid;gap:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}.notice{border:1px solid var(--border);background:var(--card-2);border-radius:16px;padding:14px;color:var(--muted);font-size:13px;line-height:1.5}.switch-row{display:flex;align-items:center;gap:10px}.switch-row input{width:auto}.preview-card,.export-box{border:1px solid var(--border);background:linear-gradient(145deg,var(--card),var(--card-2));border-radius:18px;padding:18px}.preview-title,.export-title{font-family:'Cormorant Garamond',serif;font-size:30px;line-height:1.1}.preview-copy,.export-copy{font-size:13px;line-height:1.6;color:var(--muted);margin-top:8px}.section-label{font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-top:6px}.status-list{display:grid;gap:8px}.status-item{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--border);border-radius:14px;padding:10px;font-size:12px}.ok{color:var(--green)}.bad{color:var(--danger)}.theme-card{border:1px solid var(--border);border-radius:18px;padding:18px;background:var(--card-2)}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:999;background:var(--reverse-bg);color:var(--reverse);padding:12px 17px;border-radius:999px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.nav-inner,main{padding-left:18px;padding-right:18px}.workspace{grid-template-columns:1fr}.grid2,.grid3{grid-template-columns:1fr}.list{max-height:none}.brand{font-size:24px}}
</style>
</head>
<body data-season="default">
<nav><div class="nav-inner"><div class="brand">ROAR Admin</div><div class="nav-actions"><button class="btn btn-soft" onclick="toggleTheme()">Day / Night</button><a class="btn btn-soft" href="index.html">Open ROAR</a></div></div></nav>
<main>
  <section class="gate" id="gate">
    <h1>Admin Center</h1>
    <p>Manage ROAR links, notifications, themes, quotes, support contacts, office info, and publishable data files.</p>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')unlock()"></div>
    <div class="toolbar"><button class="btn btn-primary" onclick="unlock()">Unlock</button></div>
    <p id="gateErr" class="bad hidden" style="margin-top:12px">Incorrect password.</p>
  </section>
  <section id="app" style="display:none">
    <div class="tabs" id="tabs"></div>
    <div class="workspace">
      <aside class="panel"><div class="panel-head"><div><div class="panel-title" id="listTitle"></div><div class="panel-sub" id="listSub"></div></div><button class="btn btn-soft" id="addBtn" onclick="addItem()">Add</button></div><div class="list" id="list"></div></aside>
      <section class="panel"><div class="panel-head"><div><div class="panel-title" id="editorTitle"></div><div class="panel-sub" id="editorSub"></div></div><button class="btn btn-soft" onclick="renderCurrent()">Refresh</button></div><div class="editor" id="editor"></div></section>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script src="resources.js"></script>
<script src="inspirations.js"></script>
<script src="notifications.js"></script>
<script src="links.js"></script>
<script src="whats-new.js"></script>
<script src="offices.js"></script>
<script src="support.js"></script>
<script src="holiday-effects.js" defer></script>
<script>
const ADMIN_PASSWORD='peachtree2026';
const LS_THEME='ptc_theme_v2';
const TABS=[
  ['site','Site + Theme'],
  ['notifications','Notifications'],
  ['links','Advisor Links'],
  ['inspirations','Inspirations'],
  ['offices','Office Info'],
  ['support','Support Contacts'],
  ['requests','Support Requests'],
  ['resources','Resources'],
  ['status','Test Links'],
  ['export','Export']
];
let DATA={
  SITE_CONFIG:structuredClone(typeof SITE_CONFIG==='object'?SITE_CONFIG:{}),
  NOTIFICATIONS:structuredClone(Array.isArray(NOTIFICATIONS)?NOTIFICATIONS:[]),
  QUICK_LINKS:structuredClone(Array.isArray(QUICK_LINKS)?QUICK_LINKS:[]),
  RESOURCES:structuredClone(Array.isArray(RESOURCES)?RESOURCES:[]),
  INSPIRATION_QUOTES:structuredClone(typeof INSPIRATION_QUOTES!=='undefined'&&Array.isArray(INSPIRATION_QUOTES)?INSPIRATION_QUOTES:[]),
  WHATS_NEW:structuredClone(typeof WHATS_NEW!=='undefined'&&Array.isArray(WHATS_NEW)?WHATS_NEW:[]),
  OFFICE_INFO:structuredClone(typeof OFFICE_INFO==='object'?OFFICE_INFO:{locations:[]}),
  SUPPORT_CONTACTS:structuredClone(typeof SUPPORT_CONTACTS!=='undefined'&&Array.isArray(SUPPORT_CONTACTS)?SUPPORT_CONTACTS:[]),
  REQUEST_TYPES:structuredClone(typeof REQUEST_TYPES!=='undefined'&&Array.isArray(REQUEST_TYPES)?REQUEST_TYPES:[])
};
DATA.SITE_CONFIG.activeTheme=DATA.SITE_CONFIG.activeTheme||'default';
DATA.SITE_CONFIG.versionNote=DATA.SITE_CONFIG.versionNote||'';
let tab='site';
let selected=0;
function $(id){return document.getElementById(id)}
function safe(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initTheme(){applyTheme(localStorage.getItem(LS_THEME)||'light')}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem(LS_THEME,t)}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light')}
function unlock(){if($('password').value===ADMIN_PASSWORD){$('gate').classList.add('hidden');$('app').style.display='block';renderTabs();renderCurrent();showToast('Admin unlocked')}else{$('gateErr').classList.remove('hidden');$('password').value='';$('password').focus()}}
function renderTabs(){const wrap=$('tabs');wrap.innerHTML='';TABS.forEach(([key,label])=>{const b=document.createElement('button');b.className='tab'+(key===tab?' active':'');b.textContent=label;b.onclick=()=>setTab(key);wrap.appendChild(b)})}
function setTab(t){try{commit()}catch(e){return}tab=t;selected=0;renderTabs();renderCurrent()}
function arr(){if(tab==='notifications')return DATA.NOTIFICATIONS;if(tab==='links')return DATA.QUICK_LINKS;if(tab==='resources')return DATA.RESOURCES;if(tab==='whatsnew')return DATA.WHATS_NEW;if(tab==='inspirations')return DATA.INSPIRATION_QUOTES;if(tab==='offices')return DATA.OFFICE_INFO.locations||(DATA.OFFICE_INFO.locations=[]);if(tab==='support')return DATA.SUPPORT_CONTACTS;if(tab==='requests')return DATA.REQUEST_TYPES;return []}
function iconForTab(){return {notifications:'📣',links:'🔗',resources:'📄',whatsnew:'✨',inspirations:'“',offices:'📍',support:'🛟',requests:'✉️'}[tab]||'⚙️'}
function titleForTab(){return {notifications:'Notifications',links:'Advisor Links',resources:'Resources',whatsnew:"What’s New",inspirations:'Inspirations',offices:'Office Info',support:'Support Contacts',requests:'Support Requests'}[tab]||'Editor'}
function renderCurrent(){if(tab==='site')return renderSite();if(tab==='status')return renderStatus();if(tab==='export')return renderExport();renderList();renderEditor()}
function renderList(){const list=$('list');$('listTitle').textContent=titleForTab();$('listSub').textContent=arr().length+' item'+(arr().length===1?'':'s');$('addBtn').style.display='';list.innerHTML='';arr().forEach((item,i)=>{const row=document.createElement('div');row.className='row'+(i===selected?' active':'');row.onclick=()=>{commit();selected=i;renderCurrent()};row.innerHTML=`<div class="row-ico">${safe(item.icon||iconForTab())}</div><div class="row-main"><div class="row-title">${safe(item.title||item.label||item.name||item.quote||'Untitled')}</div><div class="row-sub">${safe(item.message||item.desc||item.address||item.author||item.type||item.email||'')}</div></div>`;list.appendChild(row)});if(!arr().length)list.innerHTML='<div class="notice">No items yet. Click Add to create one.</div>'}
function renderEditor(){const item=arr()[selected];$('editorTitle').textContent=item?(item.title||item.label||item.name||item.quote||'Untitled'):'Editor';$('editorSub').textContent='Changes stay here until you export.';if(!item){$('editor').innerHTML='<div class="notice">Choose or add an item first.</div>';return}if(tab==='notifications')return renderNotificationEditor(item);if(tab==='links')return renderLinkEditor(item);if(tab==='resources')return renderResourceEditor(item);if(tab==='whatsnew')return renderWhatsNewEditor(item);if(tab==='inspirations')return renderInspirationEditor(item);if(tab==='offices')return renderOfficeEditor(item);if(tab==='support')return renderSupportEditor(item);if(tab==='requests')return renderRequestEditor(item)}
function inputField(id,label,value,type='text'){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${safe(value)}"></div>`}
function areaField(id,label,value){return `<div class="field"><label>${label}</label><textarea id="${id}">${safe(value)}</textarea></div>`}
function selectField(id,label,value,opts){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option value="${safe(o[0])}" ${o[0]===value?'selected':''}>${safe(o[1])}</option>`).join('')}</select></div>`}
function renderSite(){selected=0;$('listTitle').textContent='Site + Theme';$('listSub').textContent='Global settings';$('addBtn').style.display='none';$('list').innerHTML='<div class="notice">Control the live theme, homepage wording, banner, and version note. Theme changes export inside resources.js.</div>';$('editorTitle').textContent='Site + Theme';$('editorSub').textContent='Change normal/holiday themes and homepage copy.';const c=DATA.SITE_CONFIG;$('editor').innerHTML=`<div class="grid2">${inputField('cSiteName','Site Name',c.siteName||'ROAR')}${inputField('cNavLabel','Nav Label',c.navLabel||'ROAR')}</div>${selectField('cActiveTheme','Active Theme',c.activeTheme||'default',[['default','Normal ROAR'],['christmas','Christmas Theme'],['halloween','Halloween Theme']])}<div class="toolbar"><button class="btn btn-soft" onclick="previewTheme('default')">Preview Normal</button><button class="btn btn-soft" onclick="previewTheme('christmas')">Preview Christmas</button><button class="btn btn-soft" onclick="previewTheme('halloween')">Preview Halloween</button></div><div class="theme-card">Preview changes only affect this Admin screen until you export and upload the files.</div>${inputField('cEyebrow','Hero Eyebrow',c.eyebrow||'R Refined · O Operations · A Advisor · R Resources')}<div class="grid2">${inputField('cHeroTitle','Hero Title First Line',c.heroTitle||'ROAR')}${inputField('cHeroItalic','Hero Title Italic Line',c.heroItalic||'')}</div>${areaField('cHeroDescription','Hero Description',c.heroDescription||'')}${areaField('cAnnouncementText','Slim Banner Text',c.announcementText||'')}<div class="field"><label>Slim Banner Active</label><div class="switch-row"><input id="cAnnouncementActive" type="checkbox" ${c.announcementActive?'checked':''}> <span>Show slim banner above notifications</span></div></div>${areaField('cVersionNote','Version Note / Change Summary',c.versionNote||'')}<div class="toolbar"><button class="btn btn-primary" onclick="commitSite();showToast('Site settings saved in editor')">Save Site Settings</button></div>`}
function previewTheme(theme){$('cActiveTheme').value=theme;document.body.dataset.season=theme;if(window.ROARHoliday&&typeof window.ROARHoliday.setSeason==='function')window.ROARHoliday.setSeason(theme);showToast('Previewing '+theme)}
function commitSite(){if(!$('cSiteName'))return;const c=DATA.SITE_CONFIG;c.siteName=$('cSiteName').value;c.navLabel=$('cNavLabel').value;c.activeTheme=$('cActiveTheme').value;c.eyebrow=$('cEyebrow').value;c.heroTitle=$('cHeroTitle').value;c.heroItalic=$('cHeroItalic').value;c.heroDescription=$('cHeroDescription').value;c.announcementText=$('cAnnouncementText').value;c.announcementActive=$('cAnnouncementActive').checked;c.versionNote=$('cVersionNote').value}
function activeBox(id,checked,label='Active'){return `<div class="field"><label>${label}</label><div class="switch-row"><input id="${id}" type="checkbox" ${checked!==false?'checked':''}> <span>${label}</span></div></div>`}
function renderNotificationEditor(n){$('editor').innerHTML=`<div class="grid2">${inputField('nTitle','Title',n.title)}${selectField('nPriority','Priority',n.priority||'normal',[['high','High'],['normal','Normal'],['low','Low']])}</div>${areaField('nMessage','Message',n.message)}<div class="grid3">${inputField('nDate','Display Date',n.date||'')}${inputField('nTime','Display Time',n.time||'')}${inputField('nLocation','Display Location',n.location||'')}</div><div class="grid2">${inputField('nStartDate','Start Date',n.startDate||'','date')}${inputField('nEndDate','End Date / Expiration',n.endDate||n.expires||'','date')}</div><div class="grid2">${inputField('nLinkText','Online Button Text',n.linkText||'Online Link')}${inputField('nUrl','Online Link',n.url)}</div><div class="grid2">${inputField('nSecondText','Directions Button Text',n.secondaryLinkText||'Directions')}${inputField('nSecondUrl','Directions Link',n.secondaryUrl||'')}</div>${activeBox('nActive',n.active,'Show Notification')}<div class="toolbar"><button class="btn btn-primary" onclick="commit();showToast('Notification saved')">Save</button><button class="btn btn-soft" onclick="moveItem(-1)">Move Up</button><button class="btn btn-soft" onclick="moveItem(1)">Move Down</button><button class="btn btn-danger" onclick="deleteItem()">Delete</button></div>`}
function renderLinkEditor(l){$('editor').innerHTML=`<div class="grid3">${inputField('lIcon','Icon',l.icon||'🔗')}${inputField('lType','Gray Text / Type',l.type||'Link')}${inputField('lSection','Section',l.section||'Core Tools')}</div>${inputField('lLabel','Card Name',l.label)}${areaField('lDesc','Description',l.desc||'')}${inputField('lUrl','URL',l.url||'')}<div class="grid3">${activeBox('lNew',l.isNew,'New Badge Hidden')}${activeBox('lFeatured Hidden',l.featured,'Featured Hidden')}${activeBox('lLoginAssist',l.loginAssist,'Login Assist')}</div>${inputField('lLoginHint','Login Hint',l.loginHint||'')}<div class="toolbar"><button class="btn btn-primary" onclick="commit();showToast('Link saved')">Save</button><button class="btn btn-soft" onclick="moveItem(-1)">Move Up</button><button class="btn btn-soft" onclick="moveItem(1)">Move Down</button><button class="btn btn-soft" onclick="pinToTop()">Pin to Top</button><button class="btn btn-soft" onclick="testSingleLink()">Test Link</button><button class="btn btn-danger" onclick="deleteItem()">Delete</button></div>`}
function renderResourceEditor(r){$('editor').innerHTML=`<div class="grid3">${inputField('rIcon','Icon',r.icon||'📄')}${inputField('rType','Type',r.type||'Guide')}${inputField('rSection','Section',r.section||'Resource Library')}</div>${inputField('rLabel','Label',r.label)}${areaField('rDesc','Description',r.desc||'')}${inputField('rUrl','URL',r.url||'')} ${activeBox('rNew',r.isNew,'New Badge Hidden')}${areaField('rChildren','Children JSON',JSON.stringify(r.children||[],null,2))}<div class="toolbar"><button class="btn btn-primary" onclick="commit();showToast('Resource saved')">Save</button><button class="btn btn-soft" onclick="moveItem(-1)">Move Up</button><button class="btn btn-soft" onclick="moveItem(1)">Move Down</button><button class="btn btn-danger" onclick="deleteItem()">Delete</button></div>`}
function renderWhatsNewEditor(w){$('editor').innerHTML=`<div class="grid3">${inputField('wDate','Date / Label',w.date||'')}${inputField('wTag','Tag',w.tag||'ROAR')}${activeBox('wActive',w.active,'Show Update')}</div>${inputField('wTitle','Title',w.title||'')}${areaField('wMessage','Message',w.message||'')}<div class="toolbar"><button class="btn btn-primary" onclick="commit();showToast('What’s New saved')">Save</button><button class="btn btn-soft" onclick="moveItem(-1)">Move Up</button><button class="btn btn-soft" onclick="moveItem(1)">Move Down</button><button class="btn btn-danger" onclick="deleteItem()">Delete</button></div>`}
function renderInspirationEditor(q){$('editor').innerHTML=`${inputField('qTitle','Card Title',q.title||'Inspiration of the Day')}${areaField('qQuote','Quote',q.quote||'')}${inputField('qAuthor','Author',q.author||'')}<div class="toolbar"><button class="btn btn-primary" onclick="commit();showToast('Quote saved')">Save</button><button class="btn btn-soft" onclick="moveItem(-1)">Move Up</button><button class="btn btn-soft" onclick="moveItem(1)">Move Down</button><button class="btn btn-danger" onclick="deleteItem()">Delete</button></div>`}
function renderOfficeEditor(o){$('editorTitle').textContent=o.name||'Office';$('editorSub').textContent='Edit one office location. Hours are managed below.';$('editor').innerHTML=`<div class="grid2">${inputField('oIcon','Icon',o.icon||'📍')}${inputField('oEyebrow','Eyebrow',o.eyebrow||'Market Center')}</div>${inputField('oName','Office Name',o.name||'')}${areaField('oAddress','Address',o.address||'')}${inputField('oMapsUrl','Apple Maps Link',o.mapsUrl||'')}${inputField('oActionText','Button Text',o.actionText||'Open in Apple Maps')}<div class="preview-card"><div class="section-label">Office Section Settings</div><div class="grid2" style="margin-top:12px">${inputField('officeTitle','Section Title',DATA.OFFICE_INFO.sectionTitle||'Office Details')}${inputField('officeHours','Office Hours',DATA.OFFICE_INFO.hours||'Monday–Friday · 9:00 AM–5:00 PM')}</div>${areaField('officeCopy','Section Copy',DATA.OFFICE_INFO.copy||'')}</div><div class="toolbar"><button class="btn btn-primary" onclick="commit();showToast('Office saved')">Save</button><button class="btn btn-soft" onclick="moveItem(-1)">Move Up</button><button class="btn btn-soft" onclick="moveItem(1)">Move Down</button><button class="btn btn-danger" onclick="deleteItem()">Delete</button></div>`}
function renderSupportEditor(s){$('editor').innerHTML=`<div class="grid3">${inputField('sKey','Key',s.key||'')}${inputField('sIcon','Icon',s.icon||'🛟')}${inputField('sPerson','Person / Team',s.person||'')}</div>${inputField('sTitle','Title',s.title||'')}${inputField('sEmail','Email(s)',s.email||'')}${inputField('sSubject','Subject Line',s.subject||'')}${areaField('sDesc','Description',s.desc||'')}<div class="toolbar"><button class="btn btn-primary" onclick="commit();showToast('Support contact saved')">Save</button><button class="btn btn-soft" onclick="moveItem(-1)">Move Up</button><button class="btn btn-soft" onclick="moveItem(1)">Move Down</button><button class="btn btn-danger" onclick="deleteItem()">Delete</button></div>`}
function renderRequestEditor(r){$('editor').innerHTML=`${inputField('reqLabel','Button Label',r.label||'')}${inputField('reqTo','To Email(s)',r.to||'')}${inputField('reqSubject','Subject',r.subject||'')}${inputField('reqHint','Hint Text',r.hint||'')}<div class="toolbar"><button class="btn btn-primary" onclick="commit();showToast('Request template saved')">Save</button><button class="btn btn-soft" onclick="moveItem(-1)">Move Up</button><button class="btn btn-soft" onclick="moveItem(1)">Move Down</button><button class="btn btn-danger" onclick="deleteItem()">Delete</button></div>`}
function commit(){if(tab==='site')return commitSite();const item=arr()[selected];if(!item)return;if(tab==='notifications'&&$('nTitle')){item.title=$('nTitle').value;item.priority=$('nPriority').value;item.message=$('nMessage').value;item.date=$('nDate').value;item.time=$('nTime').value;item.location=$('nLocation').value;item.startDate=$('nStartDate').value;item.endDate=$('nEndDate').value;item.expires=$('nEndDate').value;item.linkText=$('nLinkText').value;item.url=$('nUrl').value;item.secondaryLinkText=$('nSecondText').value;item.secondaryUrl=$('nSecondUrl').value;item.active=$('nActive').checked}
if(tab==='links'&&$('lLabel')){item.icon=$('lIcon').value;item.type=$('lType').value;item.section=$('lSection').value;item.label=$('lLabel').value;item.desc=$('lDesc').value;item.url=$('lUrl').value;item.isNew=$('lNew').checked;item.featured=$('lFeatured Hidden').checked;item.loginAssist=$('lLoginAssist').checked;item.loginHint=$('lLoginHint').value}
if(tab==='resources'&&$('rLabel')){item.icon=$('rIcon').value;item.type=$('rType').value;item.section=$('rSection').value;item.label=$('rLabel').value;item.desc=$('rDesc').value;item.url=$('rUrl').value;item.isNew=$('rNew').checked;try{item.children=JSON.parse($('rChildren').value||'[]')}catch(e){showToast('Children JSON is not valid');throw e}}
if(tab==='whatsnew'&&$('wTitle')){item.date=$('wDate').value;item.tag=$('wTag').value;item.title=$('wTitle').value;item.message=$('wMessage').value;item.active=$('wActive').checked}
if(tab==='inspirations'&&$('qQuote')){item.title=$('qTitle').value;item.quote=$('qQuote').value;item.author=$('qAuthor').value}
if(tab==='offices'&&$('oName')){item.icon=$('oIcon').value;item.eyebrow=$('oEyebrow').value;item.name=$('oName').value;item.address=$('oAddress').value;item.mapsUrl=$('oMapsUrl').value;item.actionText=$('oActionText').value;DATA.OFFICE_INFO.sectionTitle=$('officeTitle').value;DATA.OFFICE_INFO.hours=$('officeHours').value;DATA.OFFICE_INFO.copy=$('officeCopy').value;DATA.OFFICE_INFO.hoursLabel=DATA.OFFICE_INFO.hoursLabel||'Office Hours'}
if(tab==='support'&&$('sTitle')){item.key=$('sKey').value;item.icon=$('sIcon').value;item.person=$('sPerson').value;item.title=$('sTitle').value;item.email=$('sEmail').value;item.subject=$('sSubject').value;item.desc=$('sDesc').value}
if(tab==='requests'&&$('reqLabel')){item.label=$('reqLabel').value;item.to=$('reqTo').value;item.subject=$('reqSubject').value;item.hint=$('reqHint').value}}
function addItem(){commit();if(tab==='notifications')DATA.NOTIFICATIONS.push({active:true,priority:'normal',title:'New Notification',message:'Add your message here.',date:'',time:'',location:'',startDate:'',endDate:'',linkText:'Online Link',url:'PASTE_LINK_HERE',secondaryLinkText:'Directions',secondaryUrl:'PASTE_LINK_HERE',expires:''});if(tab==='links')DATA.QUICK_LINKS.push({label:'New Advisor Link',desc:'Add description here.',icon:'🔗',type:'Link',url:'PASTE_LINK_HERE',section:'Core Tools',isNew:false,featured:false,loginAssist:false,loginHint:''});if(tab==='resources')DATA.RESOURCES.push({label:'New Resource',desc:'Add description here.',icon:'📄',type:'Guide',url:'PASTE_LINK_HERE',section:'Resource Library',isNew:false,children:[]});if(tab==='whatsnew')DATA.WHATS_NEW.push({active:true,date:'New',tag:'ROAR',title:'New Update',message:'Add update details here.'});if(tab==='inspirations')DATA.INSPIRATION_QUOTES.push({title:'Inspiration of the Day',quote:'Add a quote here.',author:''});if(tab==='offices')arr().push({eyebrow:'Market Center',name:'New Office',address:'',mapsUrl:'',icon:'📍',actionText:'Open in Apple Maps'});if(tab==='support')DATA.SUPPORT_CONTACTS.push({key:'new',icon:'🛟',title:'New Support Contact',person:'',email:'',desc:'',subject:''});if(tab==='requests')DATA.REQUEST_TYPES.push({label:'New Request',to:'',subject:'',hint:''});selected=arr().length-1;renderCurrent()}
function deleteItem(){if(!arr()[selected])return;if(confirm('Delete this item?')){arr().splice(selected,1);selected=Math.max(0,selected-1);renderCurrent();showToast('Deleted in editor')}}
function moveItem(dir){commit();const a=arr();const ni=selected+dir;if(ni<0||ni>=a.length)return;[a[selected],a[ni]]=[a[ni],a[selected]];selected=ni;renderCurrent();showToast('Moved')}
function pinToTop(){commit();const a=arr();if(selected<=0)return;const [item]=a.splice(selected,1);a.unshift(item);selected=0;renderCurrent();showToast('Pinned to top')}
function renderStatus(){selected=0;$('listTitle').textContent='Test Links';$('listSub').textContent='Run a quick status check';$('addBtn').style.display='none';$('list').innerHTML='<div class="notice">This uses the browser to try to reach each link. Some sites block verification, so “Could not verify” does not always mean broken.</div>';$('editorTitle').textContent='Link Status';$('editorSub').textContent='Check major advisor links before publishing.';$('editor').innerHTML=`<div class="toolbar"><button class="btn btn-primary" onclick="testAllLinks()">Test All Links</button></div><div class="status-list" id="statusResults"></div>`}
function urlForItem(item){try{const u=new URL(item.url);return u.href}catch{return ''}}
async function testOne(url){const controller=new AbortController();const t=setTimeout(()=>controller.abort(),4500);try{await fetch(url,{method:'GET',mode:'no-cors',cache:'no-store',signal:controller.signal});clearTimeout(t);return 'Looks good'}catch(e){clearTimeout(t);return e.name==='AbortError'?'Could not verify':'Possible issue'}}
async function testSingleLink(){commit();const item=arr()[selected];if(!item||!urlForItem(item)){showToast('No valid URL');return}showToast('Testing link...');const result=await testOne(urlForItem(item));showToast(result)}
async function testAllLinks(){const out=$('statusResults');out.innerHTML='';for(const item of DATA.QUICK_LINKS.filter(x=>x.url)){const row=document.createElement('div');row.className='status-item';row.innerHTML=`<span>${safe(item.label)}</span><span>Checking...</span>`;out.appendChild(row);const res=await testOne(urlForItem(item));row.lastElementChild.textContent=res;row.lastElementChild.className=res==='Looks good'?'ok':res==='Possible issue'?'bad':''}}
function renderExport(){$('listTitle').textContent='Export';$('listSub').textContent='Publish workflow';$('addBtn').style.display='none';$('list').innerHTML='<div class="notice">Export downloads every editable data file. Replace these in GitHub next to index.html and admin.html.</div>';$('editorTitle').textContent='Export Data Files';$('editorSub').textContent='Final step before publishing.';$('editor').innerHTML=`<div class="export-box"><div class="export-title">Ready to publish?</div><div class="export-copy">This downloads resources.js, inspirations.js, notifications.js, links.js, whats-new.js, offices.js, support.js, and VERSION-NOTE.txt.</div><button class="btn btn-primary" onclick="exportFile()">Download Data Files</button></div><div class="section-label">Current Counts</div><div class="grid3"><div class="preview-card"><div class="preview-title">${DATA.NOTIFICATIONS.length}</div><div class="preview-copy">Notifications</div></div><div class="preview-card"><div class="preview-title">${DATA.QUICK_LINKS.length}</div><div class="preview-copy">Advisor Links</div></div><div class="preview-card"><div class="preview-title">${DATA.INSPIRATION_QUOTES.length}</div><div class="preview-copy">Inspirations</div></div></div><div class="notice">Version note: ${safe(DATA.SITE_CONFIG.versionNote||'No version note added.')}</div>`}
function downloadDataFile(filename,content,type='application/javascript'){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportFile(){try{commit()}catch(e){return}const resourcesHeader='/* ROAR main resource data. Notifications are in notifications.js. Advisor links are in links.js. Inspirations are in inspirations.js. */\\n\\n';const inspirationsHeader='/* ROAR inspirations. Edit this file for the Inspiration of the Day card. */\\n\\n';const notificationsHeader='/* ROAR notifications. Edit this file for homepage notification cards. */\\n\\n';const linksHeader='/* ROAR advisor links. Edit this file for main homepage link cards. */\\n\\n';const whatsHeader='/* ROAR What’s New updates. Edit this file for the What’s New in ROAR section. */\\n\\n';const officesHeader='/* ROAR office information. Edit this file for office hours, addresses, and map links. */\\n\\n';const supportHeader='/* ROAR support contacts and request templates. Edit this file for Support Concierge */\\n\\n';downloadDataFile('resources.js',resourcesHeader+'let SITE_CONFIG = '+JSON.stringify(DATA.SITE_CONFIG,null,2)+';\\n\\nlet RESOURCES = '+JSON.stringify(DATA.RESOURCES,null,2)+';\\n');setTimeout(()=>downloadDataFile('inspirations.js',inspirationsHeader+'let INSPIRATION_QUOTES = '+JSON.stringify(DATA.INSPIRATION_QUOTES,null,2)+';\\n'),200);setTimeout(()=>downloadDataFile('notifications.js',notificationsHeader+'let NOTIFICATIONS = '+JSON.stringify(DATA.NOTIFICATIONS,null,2)+';\\n'),400);setTimeout(()=>downloadDataFile('links.js',linksHeader+'let QUICK_LINKS = '+JSON.stringify(DATA.QUICK_LINKS,null,2)+';\\n'),600);setTimeout(()=>downloadDataFile('whats-new.js',whatsHeader+'let WHATS_NEW = '+JSON.stringify(DATA.WHATS_NEW,null,2)+';\\n'),800);setTimeout(()=>downloadDataFile('offices.js',officesHeader+'let OFFICE_INFO = '+JSON.stringify(DATA.OFFICE_INFO,null,2)+';\\n'),1000);setTimeout(()=>downloadDataFile('support.js',supportHeader+'let SUPPORT_CONTACTS = '+JSON.stringify(DATA.SUPPORT_CONTACTS,null,2)+';\\n\\nlet REQUEST_TYPES = '+JSON.stringify(DATA.REQUEST_TYPES,null,2)+';\\n'),1200);setTimeout(()=>downloadDataFile('VERSION-NOTE.txt',(DATA.SITE_CONFIG.versionNote||'No version note added.'),'text/plain'),1400);showToast('All data files downloaded')}
let toastTimer;function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
initTheme();setTimeout(()=>$('password').focus(),200);
</script>
