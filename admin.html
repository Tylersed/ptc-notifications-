<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Peachtree · My Peachtree Portal Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="holiday-themes.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#000;--iron-ore:#222422;--ivory:#F5F4EF;--white:#fff;--gold:#A27C3D;--danger:#B42318;--green:#16803C;--ease:cubic-bezier(.22,1,.36,1)}
[data-theme="light"]{--bg:var(--ivory);--bg-2:#E9E7DF;--card:#fff;--card-2:#F8F7F2;--text:var(--iron-ore);--muted:rgba(34,36,34,.58);--soft:rgba(34,36,34,.34);--border:rgba(34,36,34,.10);--border-2:rgba(34,36,34,.18);--nav:rgba(245,244,239,.9);--reverse:var(--ivory);--reverse-bg:var(--iron-ore);--shadow:0 16px 50px rgba(0,0,0,.09),0 2px 8px rgba(0,0,0,.05)}
[data-theme="dark"]{--bg:#141614;--bg-2:#0E100E;--card:#1C1E1C;--card-2:#151815;--text:var(--ivory);--muted:rgba(245,244,239,.58);--soft:rgba(245,244,239,.34);--border:rgba(245,244,239,.09);--border-2:rgba(245,244,239,.17);--nav:rgba(14,16,14,.9);--reverse:var(--iron-ore);--reverse-bg:var(--ivory);--shadow:0 16px 50px rgba(0,0,0,.42),0 2px 8px rgba(0,0,0,.22)}
body{font-family:Geist,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100svh}button,input,textarea,select{font-family:inherit}.hidden{display:none!important}
nav{position:sticky;top:0;z-index:10;height:68px;background:var(--nav);border-bottom:1px solid var(--border);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.nav-inner{max-width:1480px;height:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 36px}.brand{font-family:'Cormorant Garamond',serif;font-size:28px}.nav-actions{display:flex;gap:10px;align-items:center}
main{max-width:1480px;margin:0 auto;padding:34px 36px 80px}.gate{max-width:500px;margin:120px auto;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:26px;padding:28px}.gate h1{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:400;margin-bottom:10px}.gate p{color:var(--muted);line-height:1.55;margin-bottom:18px}
.btn{appearance:none;border:0;border-radius:999px;padding:10px 15px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.2s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn-primary{background:var(--reverse-bg);color:var(--reverse)}.btn-soft{border:1px solid var(--border-2);background:transparent;color:var(--muted)}.btn-danger{background:var(--danger);color:white}.btn:hover{transform:translateY(-1px)}
input,textarea,select{width:100%;border:1px solid var(--border-2);background:var(--card-2);color:var(--text);border-radius:14px;padding:12px;font-size:13px;outline:none}textarea{min-height:104px;resize:vertical}.field{display:grid;gap:7px}.field label{font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.tab{border:1px solid var(--border-2);background:var(--card);color:var(--muted);border-radius:999px;padding:9px 13px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.tab.active{background:var(--reverse-bg);color:var(--reverse);border-color:var(--reverse-bg)}
.workspace{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}.panel{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:14px}.panel-title{font-family:'Cormorant Garamond',serif;font-size:28px}.panel-sub{font-size:12px;color:var(--muted);margin-top:3px}.list{max-height:calc(100svh - 250px);overflow:auto;padding:10px}.row{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;cursor:pointer;border:1px solid transparent}.row:hover,.row.active{background:var(--bg-2);border-color:var(--border)}.row-ico{font-size:20px;width:28px}.row-main{min-width:0}.row-title{font-weight:700;font-size:13px}.row-sub{font-size:11px;color:var(--muted);line-height:1.4;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}.editor{padding:20px;display:grid;gap:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}.notice{border:1px solid var(--border);background:var(--card-2);border-radius:16px;padding:14px;color:var(--muted);font-size:13px;line-height:1.5}.switch-row{display:flex;align-items:center;gap:10px}.switch-row input{width:auto}.preview-card,.export-box{border:1px solid var(--border);background:linear-gradient(145deg,var(--card),var(--card-2));border-radius:18px;padding:18px}.preview-title,.export-title{font-family:'Cormorant Garamond',serif;font-size:30px;line-height:1.1}.preview-copy,.export-copy{font-size:13px;line-height:1.6;color:var(--muted);margin-top:8px}.section-label{font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-top:6px}.status-list{display:grid;gap:8px}.status-item{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--border);border-radius:14px;padding:10px;font-size:12px}.ok{color:var(--green)}.bad{color:var(--danger)}.theme-card{border:1px solid var(--border);border-radius:18px;padding:18px;background:var(--card-2)}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:999;background:var(--reverse-bg);color:var(--reverse);padding:12px 17px;border-radius:999px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.nav-inner,main{padding-left:18px;padding-right:18px}.workspace{grid-template-columns:1fr}.grid2,.grid3{grid-template-columns:1fr}.list{max-height:none}.brand{font-size:24px}}

/* ═══ Guided Admin Workflow ═══ */
.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.dash-card{
  border:1px solid var(--border);
  background:linear-gradient(145deg,var(--card),var(--card-2));
  border-radius:20px;
  padding:18px;
  cursor:pointer;
  transition:.22s var(--ease);
  min-height:150px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.dash-card:hover{
  transform:translateY(-2px);
  border-color:var(--border-2);
  box-shadow:var(--shadow);
}
.dash-icon{font-size:26px;margin-bottom:10px}
.dash-title{font-family:'Cormorant Garamond',serif;font-size:30px;line-height:1.05}
.dash-copy{font-size:13px;line-height:1.5;color:var(--muted);margin-top:8px}
.dash-file{
  margin-top:14px;
  width:max-content;
  max-width:100%;
  border:1px solid var(--border-2);
  border-radius:999px;
  padding:6px 10px;
  font-size:9px;
  font-weight:900;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--soft);
}
.publish-note{
  border:1px solid var(--border);
  background:var(--card-2);
  border-radius:18px;
  padding:14px;
  font-size:13px;
  line-height:1.55;
  color:var(--muted);
}
.publish-note strong{color:var(--text)}
.validation-list{
  display:grid;
  gap:8px;
  margin-top:10px;
}
.validation-item{
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  font-size:12px;
  color:var(--muted);
}
.validation-item.bad{
  border-color:rgba(180,35,24,.35);
  background:rgba(180,35,24,.07);
}
.validation-item.ok{
  border-color:rgba(22,128,60,.28);
  background:rgba(22,128,60,.07);
}
.export-main-btn{
  min-width:180px;
}
@media(max-width:900px){
  .dashboard-grid{grid-template-columns:1fr}
}


/* ═══ Smooth Admin UX Fixes ═══ */
.tabs{
  position:sticky;
  top:68px;
  z-index:8;
  background:var(--bg);
  padding:10px 0 12px;
  margin:16px 0 18px!important;
  border-bottom:1px solid var(--border);
}
.tab{
  min-height:38px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
  user-select:none;
}
.tab:focus-visible,
.btn:focus-visible,
.row:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
}
.panel-head{
  align-items:flex-start;
}
.panel-head .toolbar{
  margin-top:0;
  justify-content:flex-end;
}
#editorSub,
#listSub{
  max-width:740px;
}
.unsaved-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--border-2);
  border-radius:999px;
  padding:5px 9px;
  font-size:9px;
  font-weight:900;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--soft);
}
.unsaved-pill.dirty{
  color:var(--gold);
  background:rgba(162,124,61,.08);
}
.notice strong,
.publish-note strong{
  color:var(--text);
}
@media(max-width:900px){
  .tabs{
    top:0;
    overflow-x:auto;
    flex-wrap:nowrap;
    scrollbar-width:none;
    margin-left:-18px!important;
    margin-right:-18px!important;
    padding-left:18px;
    padding-right:18px;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;
    font-size:9px;
    padding:9px 12px;
  }
  .panel-head{
    flex-direction:column;
  }
  .panel-head .toolbar{
    width:100%;
    justify-content:flex-start;
  }
  .panel-head .toolbar .btn{
    flex:1 1 auto;
  }
}


/* ═══ Drag-and-drop reorder for Admin lists ═══ */
.row{
  position:relative;
}
.row[draggable="true"]{
  cursor:grab;
}
.row.dragging{
  opacity:.42;
  transform:scale(.985);
}
.row.drag-over{
  border-color:var(--gold);
  background:rgba(162,124,61,.09);
}
.drag-handle{
  width:26px;
  height:26px;
  border:1px solid var(--border-2);
  border-radius:9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  color:var(--soft);
  flex:0 0 auto;
  cursor:grab;
  user-select:none;
}
.row:hover .drag-handle{
  color:var(--text);
  border-color:var(--border-2);
}
.reorder-help{
  border:1px solid var(--border);
  background:var(--card-2);
  border-radius:14px;
  padding:11px 12px;
  margin:10px;
  font-size:12px;
  line-height:1.45;
  color:var(--muted);
}
@media(max-width:900px){
  .drag-handle{
    width:30px;
    height:30px;
  }
}

</style>
</head>
<body data-season="default">
<nav><div class="nav-inner"><div class="brand">My Peachtree Portal Admin</div><div class="nav-actions"><button class="btn btn-soft" onclick="toggleTheme()">Day / Night</button><a class="btn btn-soft" href="index.html">Open My Peachtree Portal</a></div></div></nav>
<main>
  <section class="gate" id="gate">
    <h1>Admin Center</h1>
    <p>Manage My Peachtree Portal links, notifications, themes, quotes, support contacts, office info, and publishable data files.</p>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')unlock()"></div>
    <div class="toolbar"><button class="btn btn-primary" onclick="unlock()">Unlock</button></div>
    <p id="gateErr" class="bad hidden" style="margin-top:12px">Incorrect password.</p>
  </section>
  <section id="app" style="display:none">
    <div class="tabs" id="tabs"></div>
    <div class="workspace">
      <aside class="panel"><div class="panel-head"><div><div class="panel-title" id="listTitle"></div><div class="panel-sub" id="listSub"></div></div><button class="btn btn-soft" id="addBtn" onclick="addItem()">Add</button></div><div class="list" id="list"></div></aside>
      <section class="panel"><div class="panel-head"><div><div class="panel-title" id="editorTitle"></div><div class="panel-sub" id="editorSub"></div></div><div class="toolbar"><button class="btn btn-primary export-main-btn" id="exportPageBtn" onclick="exportCurrentFile()">Export This Page</button><button class="btn btn-soft" onclick="renderCurrent()">Refresh</button></div></div><div class="editor" id="editor"></div></section>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script src="resources.js"></script>
<script src="inspirations.js"></script>
<script src="notifications.js"></script>
<script src="links.js"></script>
<script src="whats-new.js"></script>
<script src="offices.js"></script>
<script src="support.js"></script>
<script src="holiday-effects.js" defer></script>
<script>

window.addEventListener('error', function(e){
  try{
    const gateErr=document.getElementById('gateErr');
    if(gateErr && document.getElementById('app')?.style.display==='none'){
      gateErr.textContent='Admin script error: '+(e.message||'Unknown error');
      gateErr.classList.remove('hidden');
    }
    console.error('My Peachtree Portal Admin error:', e.message, e.error);
  }catch(_){}
});

const ADMIN_PASSWORD='peachtree2026';
const LS_THEME='ptc_theme_v2';
const TABS=[
  ['home','Admin Home'],
  ['site','Homepage'],
  ['notifications','Notifications'],
  ['links','Advisor Tiles'],
  ['inspirations','Quotes'],
  ['offices','Office Details'],
  ['support','Support Concierge'],
  ['requests','Request Buttons'],
  ['resources','Resources'],
  ['status','Test Links'],
  ['export','Export / Publish']
];
let DATA={
  SITE_CONFIG:structuredClone(typeof SITE_CONFIG==='object'?SITE_CONFIG:{}),
  NOTIFICATIONS:structuredClone(Array.isArray(NOTIFICATIONS)?NOTIFICATIONS:[]),
  QUICK_LINKS:structuredClone(Array.isArray(QUICK_LINKS)?QUICK_LINKS:[]),
  RESOURCES:structuredClone(Array.isArray(RESOURCES)?RESOURCES:[]),
  INSPIRATION_QUOTES:structuredClone(typeof INSPIRATION_QUOTES!=='undefined'&&Array.isArray(INSPIRATION_QUOTES)?INSPIRATION_QUOTES:[]),
  WHATS_NEW:structuredClone(typeof WHATS_NEW!=='undefined'&&Array.isArray(WHATS_NEW)?WHATS_NEW:[]),
  OFFICE_INFO:structuredClone(typeof OFFICE_INFO==='object'?OFFICE_INFO:{locations:[]}),
  SUPPORT_CONTACTS:structuredClone(typeof SUPPORT_CONTACTS!=='undefined'&&Array.isArray(SUPPORT_CONTACTS)?SUPPORT_CONTACTS:[]),
  REQUEST_TYPES:structuredClone(typeof REQUEST_TYPES!=='undefined'&&Array.isArray(REQUEST_TYPES)?REQUEST_TYPES:[])
};
DATA.SITE_CONFIG.activeTheme=DATA.SITE_CONFIG.activeTheme||'default';
DATA.SITE_CONFIG.versionNote=DATA.SITE_CONFIG.versionNote||'';
let tab='home';
let selected=0;
let draggedIndex=null;
function $(id){return document.getElementById(id)}
function safe(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initTheme(){applyTheme(localStorage.getItem(LS_THEME)||'light')}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem(LS_THEME,t)}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light')}
function unlock(){if($('password').value===ADMIN_PASSWORD){$('gate').classList.add('hidden');$('app').style.display='block';renderTabs();renderCurrent();showToast('Admin unlocked')}else{$('gateErr').classList.remove('hidden');$('password').value='';$('password').focus()}}
function renderTabs(){const wrap=$('tabs');wrap.innerHTML='';TABS.forEach(([key,label])=>{const b=document.createElement('button');b.className='tab'+(key===tab?' active':'');b.textContent=label;b.onclick=()=>setTab(key);wrap.appendChild(b)})}
function setTab(t){
  tab=t;
  selected=0;
  renderTabs();
  renderCurrent();
  showToast(pageLabel(t)+' opened');
}
function arr(){if(tab==='notifications')return DATA.NOTIFICATIONS;if(tab==='links')return DATA.QUICK_LINKS;if(tab==='resources')return DATA.RESOURCES;if(tab==='whatsnew')return DATA.WHATS_NEW;if(tab==='inspirations')return DATA.INSPIRATION_QUOTES;if(tab==='offices')return DATA.OFFICE_INFO.locations||(DATA.OFFICE_INFO.locations=[]);if(tab==='support')return DATA.SUPPORT_CONTACTS;if(tab==='requests')return DATA.REQUEST_TYPES;return []}
function iconForTab(){return {notifications:'📣',links:'🔗',resources:'📄',whatsnew:'✨',inspirations:'“',offices:'📍',support:'🛟',requests:'✉️'}[tab]||'⚙️'}
function titleForTab(){return {notifications:'Notifications',links:'Advisor Links',resources:'Resources',whatsnew:"What’s New",inspirations:'Inspirations',offices:'Office Info',support:'Support Contacts',requests:'Support Requests'}[tab]||'Editor'}

function fileForTab(t=tab){
  if(t==='site'||t==='resources')return 'resources.js';
  if(t==='notifications')return 'notifications.js';
  if(t==='links')return 'links.js';
  if(t==='inspirations')return 'inspirations.js';
  if(t==='offices')return 'offices.js';
  if(t==='support'||t==='requests')return 'support.js';
  if(t==='whatsnew')return 'whats-new.js';
  return 'resources.js';
}
function contentForFile(file){
  const headers={
    'resources.js':'/* My Peachtree Portal main resource data. Notifications are in notifications.js. Advisor links are in links.js. Inspirations are in inspirations.js. */\\n\\n',
    'inspirations.js':'/* My Peachtree Portal inspirations. Edit this file for the Inspiration of the Day card. */\\n\\n',
    'notifications.js':'/* My Peachtree Portal notifications. Edit this file for homepage notification cards. */\\n\\n',
    'links.js':'/* My Peachtree Portal advisor links. Edit this file for main homepage link cards. */\\n\\n',
    'whats-new.js':'/* My Peachtree Portal What’s New updates. Edit this file for the What’s New in My Peachtree Portal section. */\\n\\n',
    'offices.js':'/* My Peachtree Portal office information. Edit this file for office hours, addresses, and map links. */\\n\\n',
    'support.js':'/* My Peachtree Portal support contacts and request templates. Edit this file for Support Concierge. */\\n\\n'
  };
  if(file==='resources.js')return headers[file]+'let SITE_CONFIG = '+JSON.stringify(DATA.SITE_CONFIG,null,2)+';\\n\\nlet RESOURCES = '+JSON.stringify(DATA.RESOURCES,null,2)+';\\n';
  if(file==='inspirations.js')return headers[file]+'let INSPIRATION_QUOTES = '+JSON.stringify(DATA.INSPIRATION_QUOTES,null,2)+';\\n';
  if(file==='notifications.js')return headers[file]+'let NOTIFICATIONS = '+JSON.stringify(DATA.NOTIFICATIONS,null,2)+';\\n';
  if(file==='links.js')return headers[file]+'let QUICK_LINKS = '+JSON.stringify(DATA.QUICK_LINKS,null,2)+';\\n';
  if(file==='whats-new.js')return headers[file]+'let WHATS_NEW = '+JSON.stringify(DATA.WHATS_NEW,null,2)+';\\n';
  if(file==='offices.js')return headers[file]+'let OFFICE_INFO = '+JSON.stringify(DATA.OFFICE_INFO,null,2)+';\\n';
  if(file==='support.js')return headers[file]+'let SUPPORT_CONTACTS = '+JSON.stringify(DATA.SUPPORT_CONTACTS,null,2)+';\\n\\nlet REQUEST_TYPES = '+JSON.stringify(DATA.REQUEST_TYPES,null,2)+';\\n';
  return '';
}
function sectionFileNote(){return 'Current section modifies: '+fileForTab();}

function pageLabel(t=tab){
  return {
    home:'Admin Home',
    site:'Homepage + Theme',
    notifications:'Notifications',
    links:'Advisor Link Tiles',
    inspirations:'Motivational Quotes',
    offices:'Office Details',
    support:'Support Concierge',
    requests:'Support Request Buttons',
    resources:'Resource Cards',
    status:'Test Links',
    export:'Export / Publish'
  }[t]||'Current Page';
}
function pageAction(t=tab){
  return {
    site:'change the theme or homepage wording',
    notifications:'add or update homepage notifications',
    links:'add or update advisor link tiles',
    inspirations:'add or update motivational quotes',
    offices:'update office hours, addresses, or map links',
    support:'update Support Concierge contacts and email templates',
    requests:'update common support request buttons',
    resources:'update resource cards',
    status:'test links before publishing',
    export:'download a file for GitHub'
  }[t]||'make updates';
}
function exportLabel(t=tab){
  return 'Export '+pageLabel(t);
}
function setExportButton(){
  const btn=$('exportPageBtn');
  if(!btn)return;
  const hide=(tab==='home'||tab==='status'||tab==='export');
  btn.style.display=hide?'none':'inline-flex';
  btn.classList.toggle('hidden',hide);
  if(!hide)btn.textContent=exportLabel();
}
function githubInstructions(file){
  return `<div class="publish-note"><strong>After download:</strong><br>1. Go to GitHub.<br>2. Open the My Peachtree Portal website repo.<br>3. Replace <strong>${file}</strong> with the downloaded file.<br>4. Commit changes.<br>5. Refresh My Peachtree Portal and test the page.</div>`;
}
function dashboardCards(){
  return [
    ['notifications','📣','Notifications','Meeting notices, online links, directions, and expiration dates.'],
    ['links','🔗','Advisor Link Tiles','Change portal links, tile names, descriptions, folders, and reports.'],
    ['support','🛟','Support Concierge','Change support contacts, recipients, subjects, and email body templates.'],
    ['offices','📍','Office Details','Change office hours, addresses, and Apple Maps links.'],
    ['inspirations','“','Motivational Quotes','Add, edit, or remove quotes shown on the homepage.'],
    ['site','🎨','Homepage + Theme','Switch Normal, Christmas, or Halloween and update homepage copy.'],
    ['resources','📄','Update Resource Cards','Edit resource cards if you use the resource area in this My Peachtree Portal build.'],
    ['status','✅','Test Links','Check links before publishing changes.']
  ];
}
function renderHome(){
  $('listTitle').textContent='Admin Home';
  $('listSub').textContent='Choose what you need to update';
  $('addBtn').style.display='none';
  $('list').innerHTML='<div class="notice">Start here. Pick the page you need to update. The portal will tell you which single file to export and replace in GitHub.</div>';
  $('editorTitle').textContent='What are you trying to update?';
  $('editorSub').textContent='No coding needed. Choose a page below. Top buttons now open instantly.';

function canDragCurrentTab(){
  return !['home','site','status','export'].includes(tab) && Array.isArray(arr()) && arr().length>1;
}
function reorderItems(from,to){
  const a=arr();
  if(from===null||to===null||from===to||from<0||to<0||from>=a.length||to>=a.length)return;
  const [item]=a.splice(from,1);
  a.splice(to,0,item);
  selected=to;
  renderCurrent();
  showToast(pageLabel()+' reordered. Export this page when finished.');
}
function rowDragStart(e,i){
  draggedIndex=i;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',String(i));
}
function rowDragOver(e,i){
  if(draggedIndex===null)return;
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
  e.dataTransfer.dropEffect='move';
}
function rowDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function rowDrop(e,i){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const from=draggedIndex!==null?draggedIndex:Number(e.dataTransfer.getData('text/plain'));
  draggedIndex=null;
  reorderItems(from,i);
}
function rowDragEnd(e){
  draggedIndex=null;
  document.querySelectorAll('.row.dragging,.row.drag-over').forEach(r=>r.classList.remove('dragging','drag-over'));
}

function renderList(){
  const list=$('list');if(!list)return;
  $('listTitle').textContent=titleForTab();
  $('listSub').textContent=arr().length+' item'+(arr().length===1?'':'s')+' · Exports '+fileForTab();
  $('addBtn').style.display='';
  list.innerHTML='';
  const dragEnabled=canDragCurrentTab();
  if(dragEnabled){
    const help=document.createElement('div');
    help.className='reorder-help';
    help.innerHTML='<strong>Reorder:</strong> drag the handle ↕ to move items. Then click <strong>Export This Page</strong>.';
    list.appendChild(help);
  }
  arr().forEach((item,i)=>{
    const row=document.createElement('div');
    row.className='row'+(i===selected?' active':'');
    row.draggable=dragEnabled;
    if(dragEnabled){
      row.ondragstart=e=>rowDragStart(e,i);
      row.ondragover=e=>rowDragOver(e,i);
      row.ondragleave=rowDragLeave;
      row.ondrop=e=>rowDrop(e,i);
      row.ondragend=rowDragEnd;
    }
    row.onclick=e=>{
      if(e.target.closest('.drag-handle'))return;
      selected=i;
      renderCurrent();
    };
    row.tabIndex=0;
    row.onkeydown=e=>{
      if(e.key==='Enter'||e.key===' '){
        e.preventDefault();
        selected=i;
        renderCurrent();
      }
    };
    row.innerHTML=`${dragEnabled?'<div class="drag-handle" title="Drag to reorder">↕</div>':''}<div class="row-ico">${safe(item.icon||iconForTab())}</div><div class="row-main"><div class="row-title">${safe(item.title||item.label||item.name||item.quote||'Untitled')}</div><div class="row-sub">${safe(item.message||item.desc||item.address||item.author||item.type||item.email||'')}</div></div>`;
    list.appendChild(row);
  });
  if(!arr().length)list.innerHTML='<div class="notice">No items yet. Click Add to create one.</div>';
}

  const badUrl=v=>String(v||'').trim() && !/^https?:\/\//i.test(String(v).trim()) && !String(v).startsWith('mailto:');
  if(file==='notifications.js'){
    DATA.NOTIFICATIONS.forEach((n,i)=>{
      if(n.active!==false && isBlank(n.title))issues.push('Notification '+(i+1)+' is missing a title.');
      if(n.active!==false && isBlank(n.message))issues.push('Notification '+(i+1)+' is missing a message.');
    });
  }
  if(file==='links.js'){
    DATA.QUICK_LINKS.forEach((l,i)=>{
      if(isBlank(l.label))issues.push('Advisor link '+(i+1)+' is missing a title.');
      if((!l.children||!l.children.length) && isBlank(l.url))issues.push((l.label||'Advisor link '+(i+1))+' is missing a URL or folder options.');
      if(badUrl(l.url))issues.push((l.label||'Advisor link '+(i+1))+' has a URL that may not open correctly.');
    });
  }
  if(file==='support.js'){
    DATA.SUPPORT_CONTACTS.forEach((s,i)=>{
      if(isBlank(s.title))issues.push('Support contact '+(i+1)+' is missing a title.');
      if(isBlank(s.email))issues.push((s.title||'Support contact '+(i+1))+' is missing an email.');
      if(isBlank(s.subject))issues.push((s.title||'Support contact '+(i+1))+' is missing a subject line.');
    });
    DATA.REQUEST_TYPES.forEach((r,i)=>{
      if(isBlank(r.label))issues.push('Support request button '+(i+1)+' is missing a label.');
      if(isBlank(r.to))issues.push((r.label||'Support request '+(i+1))+' is missing a recipient.');
    });
  }
  if(file==='offices.js'){
    (DATA.OFFICE_INFO.locations||[]).forEach((o,i)=>{
      if(isBlank(o.name))issues.push('Office '+(i+1)+' is missing a name.');
      if(isBlank(o.address))issues.push((o.name||'Office '+(i+1))+' is missing an address.');
      if(isBlank(o.mapsUrl))issues.push((o.name||'Office '+(i+1))+' is missing an Apple Maps link.');
    });
  }
  if(file==='inspirations.js'){
    if(!DATA.INSPIRATION_QUOTES.length)issues.push('There are no motivational quotes.');
    DATA.INSPIRATION_QUOTES.forEach((q,i)=>{if(isBlank(q.quote))issues.push('Quote '+(i+1)+' is blank.');});
  }
  return issues;
}
function confirmExport(file){
  const issues=validateFile(file);
  if(!issues.length)return true;
  const msg='Before exporting '+file+', My Peachtree Portal found these possible issues:\\n\\n- '+issues.slice(0,8).join('\\n- ')+(issues.length>8?'\\n- And '+(issues.length-8)+' more...':'')+'\\n\\nExport anyway?';
  return confirm(msg);
}

function exportCurrentFile(){if(!safeCommit(false))return;const file=fileForTab();if(!confirmExport(file))return;downloadDataFile(file,contentForFile(file));showToast(pageLabel()+' exported. Replace '+file+' in GitHub.')}
function exportSelectedFile(){if(!safeCommit(false))return;const file=$('exportFileSelect')?.value||fileForTab();if(!confirmExport(file))return;downloadDataFile(file,contentForFile(file));showToast('Downloaded '+file+'. Replace only this file in GitHub.')}
function exportAllFiles(){if(!safeCommit(false))return;const files=['resources.js','inspirations.js','notifications.js','links.js','whats-new.js','offices.js','support.js'];files.forEach((file,i)=>setTimeout(()=>downloadDataFile(file,contentForFile(file)),i*200));setTimeout(()=>downloadDataFile('VERSION-NOTE.txt',(DATA.SITE_CONFIG.versionNote||'No version note added.'),'text/plain'),files.length*200);showToast('All data files downloaded')}
function exportFile(){exportCurrentFile()}
let toastTimer;function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
initTheme();setTimeout(()=>$('password').focus(),200);
</script>
